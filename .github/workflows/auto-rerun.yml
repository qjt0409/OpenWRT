# SPDX-License-Identifier: MIT
# OpenWrt-Build 失败自动重跑看门狗
# 构建以 failure / cancelled 结束时自动整轮重跑，总尝试次数上限 3（含首次）；
# 成功不触发；确定性故障同样会被重试到上限，这是自动化换来的代价。
name: OpenWrt-AutoRerun

on:
  workflow_run:
    workflows: [OpenWrt-Build]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: 重新运行失败的构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "OpenWrt-Build run ${{ github.event.workflow_run.id }} 第 ${{ github.event.workflow_run.run_attempt }} 次尝试以 ${{ github.event.workflow_run.conclusion }} 结束，自动重跑"
          gh run rerun ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
